
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 영화 보드</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 상단 메뉴 -->
  <header class="top">
    <h1>🎬 내 영화 보드</h1>
    <nav>
      <ul>
        <li><a href="#board">영화 보드</a></li>
      </ul>
    </nav>
  </header>

  <!-- 히어로 영역 -->
  <section class="hero">
    <h2>내가 좋아하는 영화 이야기</h2>
    <p>내 인생 영화 5편과 일별 박스오피스 TOP 5</p>
    <p>다양한 영화들을 한눈에 만나보세요!</p>
  </section>

  <main>

    <!-- 검색, 필터, 정렬 -->
    <div class="toolbar">

      <input
        id="q"
        type="search"
        placeholder="영화 제목 검색"
      >

      <fieldset id="typeFilter">
        <legend>보기</legend>

        <label>
          <input type="radio" name="type" value="all" checked>
          전체
        </label>

        <label>
          <input type="radio" name="type" value="mine">
          내 영화
        </label>

        <label>
          <input type="radio" name="type" value="boxoffice">
          박스오피스
        </label>
      </fieldset>

      <label for="sort">정렬</label>

      <select id="sort">
        <option value="rating">평점순</option>
        <option value="year">최신 개봉순</option>
        <option value="title">제목 가나다순</option>
      </select>

      <p>
        <span id="count"></span>,
        찜 <span id="likeCount">0</span>편
      </p>

    </div>

    <!-- 자바스크립트가 영화 카드를 생성하는 영역 -->
    <section class="board" id="board"></section>

    <!-- 검색 결과가 없을 때 -->
    <p class="state-empty">조건에 맞는 영화가 없습니다.</p>

    <!-- 영화 상세 정보 -->
    <dialog id="detail">
      <div id="detailBody"></div>
      <button type="button" id="closeDetail">닫기</button>
    </dialog>

  </main>

  <!-- 하단 출처 -->
  <footer>
    <p>이 사이트는 TMDB API를 사용하지만 TMDB의 보증이나 인증을 받지 않았습니다.</p>

    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>

    <p>
      영화 정보 및 포스터:
      <a href="https://www.themoviedb.org"
         target="_blank"
         rel="noopener noreferrer">TMDB</a>
    </p>

    <p>
      박스오피스 출처:
      <a href="https://www.kobis.or.kr"
         target="_blank"
         rel="noopener noreferrer">KOBIS</a>
      (2026-10-18 기준)
    </p>
  </footer>

  <!-- 영화 데이터 -->
  <script src="data.js"></script>

  <!-- 영화 보드 기능 -->
  <script src="app.js"></script>

</body>
</html>
